name: Sync to yah-forge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'scripts/poe-polyfill-template.js'
      - 'scripts/adapt-index-for-poe.py'
      - 'scripts/build-yah-forge-port.sh'
      - 'scripts/push-yah-forge-port.sh'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require sync token
        env:
          TOKEN: ${{ secrets.YAH_FORGE_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "YAH_FORGE_SYNC_TOKEN secret not set — add it under repo Settings → Secrets → Actions" >&2
            exit 1
          fi
      - name: Push port to yah-forge
        env:
          YAH_FORGE_SYNC_TOKEN: ${{ secrets.YAH_FORGE_SYNC_TOKEN }}
        run: |
          chmod +x scripts/push-yah-forge-port.sh
          ./scripts/push-yah-forge-port.sh
